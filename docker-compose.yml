# docker-compose.yml
# ------------------
# Spins up MongoDB + backend + frontend together for local development.
# Usage: docker compose up --build
version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: student-management-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: student-management-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/student_management
      CORS_ALLOW_ORIGIN: http://localhost:5173
      DEFAULT_PAGE_SIZE: 10
      MAX_PAGE_SIZE: 100
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build: ./frontend
    container_name: student-management-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo-data:
  uploads-data:
